# One blueprint, one service, at no monthly cost.
#
# The brief specifies three services plus Redis plus Postgres. That shape is
# right for an app with real traffic, and it costs about $35 a month — for four
# people checking a table. What actually drives that bill is process separation:
# a background worker exists only to poll, and Redis exists only so that worker
# and the api can share a cache.
#
# At this size neither buys anything. asyncio already keeps a slow upstream off
# every other request, and one poll still serves all four people whether it runs
# in its own process or not. So the poller runs inside the api
# (POLLER_IN_PROCESS), the cache is in-process, and the database is external.
#
# The frontend is served by the api rather than as a separate static site, for
# a reason that has nothing to do with cost: two origins makes the session
# cookie third-party, and every browser on iOS is WebKit, so Safari drops it and
# nobody can sign in from a phone. Three of the four watch on one.
#
# To restore the briefed architecture, set POLLER_IN_PROCESS=false and
# SERVE_FRONTEND=false, add back a `worker` service running
# `python -m services.poller.main`, a `keyvalue` service for REDIS_URL, and a
# static site with VITE_API_BASE and FRONTEND_ORIGIN. Nothing in the code needs
# to change — but plan for a custom domain, or the phones stay locked out.

services:
  # ---- the api, with the poller running inside it.
  #
  # On the free plan this spins down after 15 minutes idle and takes 30-60s to
  # wake. While it sleeps the poller sleeps too, so live scores refresh only
  # once somebody opens the page. Change `plan` to `starter` for ~$7/month and
  # it never sleeps.
  - type: web
    name: league-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    # No preDeployCommand: Render offers that only on paid plans. The image's
    # entrypoint runs `alembic upgrade head` before starting uvicorn, and exits
    # non-zero if it fails, so a bad migration fails the deploy rather than
    # serving traffic against a schema that never arrived.
    envVars:
      - fromGroup: league-secrets
      - key: ENVIRONMENT
        value: production
      - key: POLLER_IN_PROCESS
        value: "true"
      # The api serves the React app from the same origin, so there is no
      # cross-origin request to allow and no third-party cookie to lose.
      - key: SERVE_FRONTEND
        value: "true"

  # ---- cron jobs. Billed per minute of runtime, so a job that finishes in
  # seconds costs a fraction of a cent a month. They run in their own container
  # with an empty cache and fetch what they need themselves, which also means
  # they still run when the api is asleep.
  - type: cron
    name: league-weekly
    runtime: docker
    dockerfilePath: ./services/scheduler/Dockerfile
    dockerContext: .
    schedule: '0 6 * * 1' # Monday 06:00 UTC: snapshot, leaderboard, summary
    dockerCommand: python -m services.scheduler.main weekly
    envVars:
      - fromGroup: league-secrets

  - type: cron
    name: league-daily
    runtime: docker
    dockerfilePath: ./services/scheduler/Dockerfile
    dockerContext: .
    schedule: '0 5 * * *' # Daily 05:00 UTC: line of the day, On This Day
    dockerCommand: python -m services.scheduler.main daily
    envVars:
      - fromGroup: league-secrets

envVarGroups:
  - name: league-secrets
    envVars:
      # Values are set in the Render dashboard, never committed here.
      #
      # An external Postgres, because Render's free tier is deleted 30 days
      # after creation — which would fall in the middle of the season. Neon and
      # Supabase both have a genuinely persistent free tier. Paste the full
      # connection string; a bare postgresql:// is normalised in shared/config.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CODE_COYG
        sync: false
      - key: CODE_AURE
        sync: false
      - key: CODE_TWZT
        sync: false
      - key: CODE_BULBA
        sync: false
      # Optional. Each missing key degrades one panel with a clear message.
      - key: FOOTBALL_DATA_KEY
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Left empty for the default onrender.com hosts, which share no usable
      # parent domain: the cookie is then third-party, SameSite=None; Secure.
      # Set to ".yourdomain.com" once a custom domain covers both services.
      - key: COOKIE_DOMAIN
        sync: false
