# One blueprint, the whole stack. Secrets live in the environment group and
# never in this file.

databases:
  - name: league-postgres
    plan: basic-256mb
    databaseName: league
    user: league

services:
  # ---- the frontend: a static site on Render's CDN, never served from Python
  - type: web
    name: league-web
    runtime: static
    buildCommand: cd apps/web && npm ci && npm run build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE
        value: https://api.example.com   # replace with the api service's domain
    routes:
      # A single-page app: every unknown path is the app shell, not a 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # ---- the api: always on, because a cold start on a live-score page is the
  # exact failure this architecture exists to avoid.
  - type: web
    name: league-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - fromGroup: league-secrets
      - key: DATABASE_URL
        fromDatabase: { name: league-postgres, property: connectionString }
      - key: REDIS_URL
        fromService: { name: league-redis, type: keyvalue, property: connectionString }
      - key: ENVIRONMENT
        value: production

  # ---- the poller: the only process that talks to an upstream
  - type: worker
    name: league-poller
    runtime: docker
    dockerfilePath: ./services/poller/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - fromGroup: league-secrets
      - key: DATABASE_URL
        fromDatabase: { name: league-postgres, property: connectionString }
      - key: REDIS_URL
        fromService: { name: league-redis, type: keyvalue, property: connectionString }
      - key: ENVIRONMENT
        value: production

  - type: keyvalue
    name: league-redis
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # ---- cron jobs
  - type: cronjob
    name: league-weekly
    runtime: docker
    dockerfilePath: ./services/scheduler/Dockerfile
    dockerContext: .
    schedule: '0 6 * * 1' # Monday 06:00 UTC: snapshot, leaderboard, summary, push
    dockerCommand: python -m services.scheduler.main weekly
    envVars:
      - fromGroup: league-secrets
      - key: DATABASE_URL
        fromDatabase: { name: league-postgres, property: connectionString }
      - key: REDIS_URL
        fromService: { name: league-redis, type: keyvalue, property: connectionString }

  - type: cronjob
    name: league-daily
    runtime: docker
    dockerfilePath: ./services/scheduler/Dockerfile
    dockerContext: .
    schedule: '0 5 * * *' # Daily 05:00 UTC: line of the day, On This Day
    dockerCommand: python -m services.scheduler.main daily
    envVars:
      - fromGroup: league-secrets
      - key: DATABASE_URL
        fromDatabase: { name: league-postgres, property: connectionString }
      - key: REDIS_URL
        fromService: { name: league-redis, type: keyvalue, property: connectionString }

  - type: cronjob
    name: league-hourly
    runtime: docker
    dockerfilePath: ./services/scheduler/Dockerfile
    dockerContext: .
    schedule: '30 * * * *' # Hourly: prune caches, log quota usage
    dockerCommand: python -m services.scheduler.main hourly
    envVars:
      - fromGroup: league-secrets
      - key: REDIS_URL
        fromService: { name: league-redis, type: keyvalue, property: connectionString }

envVarGroups:
  - name: league-secrets
    envVars:
      # Values are set in the Render dashboard, never committed here.
      - key: SESSION_SECRET
        generateValue: true
      - key: CODE_COYG
        sync: false
      - key: CODE_AURE
        sync: false
      - key: CODE_TWZT
        sync: false
      - key: CODE_BULBA
        sync: false
      - key: FOOTBALL_DATA_KEY
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY
        sync: false
      - key: R2_SECRET_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
